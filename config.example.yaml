# beeper example configuration.
# Copy to ~/.config/beeper/config.yaml and edit.

grid:
  device: null            # null = auto-discover via serialosc; or an id like "m1000011"
  cols: 16                # your grid width  (128 = 16x8, 64 = 8x8)
  rows: 8                 # your grid height
  blink_hz: 0.7           # slow pulse rate for a pending button
  varibright: true        # true for modern varibright grids; set false for older
                           # monobright grids (64/40h) so buttons blink on/off
  serialosc:              # optional: have beeper start serialoscd for you
    autostart: false      # set true to spawn serialoscd if it isn't running
    command: ["serialoscd"]  # override if serialoscd isn't on PATH
  brightness:
    idle: 0
    blink_low: 3
    blink_high: 14
    confirm: 15

webhook:
  host: 127.0.0.1
  port: 8420
  token: ${BEEPER_TOKEN}  # optional; omit to disable auth

# Helper processes to ensure are running before channels start.
# beeper probes `health`; if nothing answers it spawns `command`, waits
# for `health` to respond, then continues. Bridges beeper spawns are
# stopped when beeper exits. See README.md#gmail.
bridges:
  - id: gmail
    command: ["gmail-bridge", "start"]
    health: "http://localhost:9000/unread"
  # Example of a second gmail-bridge on its own port, filtered to one sender:
  # an app that emails you (invites, alerts) but has no pollable API/RSS. Same
  # one-time `gmail-bridge auth`; verify the sender/query in your inbox. See
  # README.md#notifying-on-app-email. (For Slack on a managed workspace, the
  # OAuth app is usually blocked; use the desktop-notification route instead,
  # see the slack channel below and README.md#bridging-desktop-notifications.)
  # - id: alerts
  #   command: ["gmail-bridge", "start", "--port", "9001", "--query", "from:alerts@example.com is:unread label:alerts"]
  #   health: "http://localhost:9001/unread"

channels:
  # Push: any app can fire this with
  #   curl -X POST http://127.0.0.1:8420/notify/prs
  - id: prs
    button: [0, 0]
    trigger: { type: webhook }
    raise: { open: "https://github.com/pulls" }

  # Poll a local JSON endpoint; fire when unread count goes above zero.
  # For Gmail, run `gmail-bridge` (see README.md#gmail) to serve this endpoint.
  - id: mail
    button: [1, 0]
    trigger:
      type: poll
      url: "http://localhost:9000/unread"
      interval: 60          # seconds
      when: "$.count > 0"   # edge-triggered
    raise: { run: "thunderbird" }

  # Watch an RSS/Atom feed; fire when a new item appears.
  - id: news
    button: [2, 0]
    trigger:
      type: rss
      url: "https://example.com/feed.xml"
      interval: 300
    raise: { open: "https://example.com" }

  # Desktop-notification channels. desktop-notify-bridge watches the session
  # notification bus and POSTs the channel named for each app in
  # ~/.config/beeper/notify-rules.yaml (see config.notify-rules.example.yaml).
  # No OAuth, no email; it works for any app that posts a desktop notification,
  # managed Slack included. Run it as a service; see
  # README.md#bridging-desktop-notifications.
  - id: slack
    button: [3, 0]
    trigger: { type: webhook }
    raise: { open: "https://app.slack.com/client" }

  - id: calendar
    button: [4, 0]
    trigger: { type: webhook }
    raise: { open: "https://calendar.google.com" }
